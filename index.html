<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="globe-outline.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-0BDJLWKFQJ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-0BDJLWKFQJ");
    </script>

    <title>Around the world</title>

    <!-- Apply the saved colour theme before first paint to avoid a flash. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem("darkModeCase"))) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* ignore unavailable/corrupt storage */
      }
    </script>
  </head>
  <body
    class="min-h-screen bg-veryLightGray pb-10 font-nunito text-veryDarkBlueText antialiased dark:bg-veryDarkBlueBg dark:text-veryLightGray"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
